<!DOCTYPE html>
<html>
<head>
    <title>PH-style intro generator</title>
    <meta name="viewport" content="width=device-width">
    <script src="./index.ts" type="module"></script>
    <link rel="icon" href="site-logo.png" type="image-png">
</head>
<body>
<!-- Inlined svg icons are from fonts.google.com -->
<ph-app>
    <canvas width="1920" height="1080"></canvas>
    <input type="range" class="slider" value="0">
    <div class="progress">
        <span class="percent">0%</span>
        <span class="time">0ms</span>
    </div>
    <div class="actions">
        <button class="play primary">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                    <path d="M320-200v-560l440 280-440 280Zm80-280Zm0 134 210-134-210-134v268Z"/>
                </svg>
                <span data-i18n="play">Play</span>
            </div>
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                    <path d="M520-200v-560h240v560H520Zm-320 0v-560h240v560H200Zm400-80h80v-400h-80v400Zm-320 0h80v-400h-80v400Zm0-400v400-400Zm320 0v400-400Z"/>
                </svg>
                <span data-i18n="pause">Pause</span>
            </div>
        </button>
        <button class="export primary">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
            </svg>
            <span data-i18n="export">Export</span>
        </button>
    </div>
    <div class="custom-text">
        <div>
            <input class="p-text" value="Porn">
            <input class="h-text" value="hub">
        </div>
        <input class="c-text" value="community">
    </div>
    <div class="debug hidden">
        <input type="checkbox" id="debug-checkbox">
        <label for="debug-checkbox">Debug mode</label>
    </div>
    <dialog class="render">
        <h2 data-i18n="render">Render</h2>
        <h3 data-i18n="resolution">Resolution</h3>
        <span>1920x1080</span>
        <h3 data-i18n="framerate">Framerate</h3>
        <span>60FPS</span>
        <h3 data-i18n="video_codecs">Video codec</h3>
        <div class="video-codecs"></div>
        <div class="buttons">
            <button class="cancel rounded tonal" data-i18n="cancel">Cancel</button>
            <button class="render primary">
                <span class="idle" data-i18n="render">Render</span>
                <span class="rendering" data-i18n="rendering"></span>
            </button>
        </div>
    </dialog>
</ph-app>
</body>
</html>
