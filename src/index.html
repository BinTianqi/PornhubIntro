<!DOCTYPE html>
<html>
<head>
    <title>PH-style intro generator</title>
    <meta name="viewport" content="width=device-width">
    <script src="./index.ts" type="module"></script>
</head>
<body>
    <ph-app>
        <canvas width="1920" height="1080"></canvas>
        <input type="range" class="slider" max="1000" value="0">
        <div class="progress">
            <span class="percent">0.0000</span>
            <span class="time">0ms</span>
        </div>
        <div id="actions">
            <button class="start">Start</button>
            <button class="export">Export</button>
        </div>
        <div class="custom-text">
            <div>
                <input class="p-text" value="Porn">
                <input class="h-text" value="hub">
            </div>
            <input class="c-text" value="community">
        </div>
        <div class="debug hidden">
            <input type="checkbox" id="debug-checkbox">
            <label for="debug-checkbox">Debug mode</label>
        </div>
    </ph-app>
</body>
</html>
